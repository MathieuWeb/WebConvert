---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/pema2735/webconvert.fr/
    # Root files (.htaccess listed explicitly: `*` skips dotfiles) + every
    # non-hidden folder, copied as folders (find avoids cp's trailing-slash
    # quirks). build/ is copied too but .htaccess answers 404 for it.
    - /bin/cp -R index.html 404.html favicon.ico .htaccess robots.txt sitemap.xml site.webmanifest $DEPLOYPATH
    - /usr/bin/find . -mindepth 1 -maxdepth 1 -type d ! -name '.*' -exec /bin/cp -R {} $DEPLOYPATH \;
